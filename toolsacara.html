<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Acara</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --primary-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: rgba(51, 65, 85, 0.6);
            --btn-hover: rgba(79, 70, 229, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Mode Default (Potret HP): Tombol ke bawah */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .arrow {
            font-size: 1.1rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        /* Interaksi Sentuh (Touch feedback responsif HP) */
        .btn:hover, .btn:active {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        .btn:hover .arrow, .btn:active .arrow {
            transform: translateX(3px);
            color: #fff;
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* --- PENGATURAN KHUSUS POSISI LANDSCAPE DI HP / LAYAR LEBAR --- */
        @media (min-height: 300px) and (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 10px;
            }
            .container {
                max-width: 700px;
                padding: 16px 20px;
            }
            h1 { font-size: 1.3rem; margin-bottom: 2px; }
            p.subtitle { margin-bottom: 12px; font-size: 0.8rem; }
            
            /* Ubah tombol jadi grid 2 kolom otomatis saat HP diputar landscape */
            .button-group {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            .icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            footer { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tools Acara</h1>
        <p class="subtitle">Menu dan tautan kegiatan dk3</p>
        
        <div class="button-group">
            <a href="http://tiny.cc/dk3daftaracara" class="btn" target="_blank">
                <div class="btn-content">
                    <span class="icon">📝</span>
                    <span>Pendaftaran (Konfirmasi Kehadiran)</span>
                </div>
                <span class="arrow">&rsaquo;</span>
            </a>
            
            <a href="http://t.me/seblakdk3bot" class="btn" target="_blank">
                <div class="btn-content">
                    <span class="icon">📋</span>
                    <span>Presensi [klik presensi di seblakdk3bot]</span>
                </div>
                <span class="arrow">&rsaquo;</span>
            </a>
            
            <a href="http://tiny.cc/dk3rundown" class="btn" target="_blank">
                <div class="btn-content">
                    <span class="icon">📅</span>
                    <span>Rundown</span>
                </div>
                <span class="arrow">&rsaquo;</span>
            </a>
            
            <a href="http://tiny.cc/dk3evagiat" class="btn" target="_blank">
                <div class="btn-content">
                    <span class="icon">⭐</span>
                    <span>Evaluasi</span>
                </div>
                <span class="arrow">&rsaquo;</span>
            </a>
            
            <a href="http://tiny.cc/dk3materi" class="btn" target="_blank">
                <div class="btn-content">
                    <span class="icon">📂</span>
                    <span>Materi</span>
                </div>
                <span class="arrow">&rsaquo;</span>
            </a>
        </div>

        <footer>
            &copy; 2026 Tools Acara
        </footer>
    </div>

</body>
</html>
