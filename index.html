<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Acara GCQ</title>

    <style>
        /* =========================
           RESET
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #1565c0;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }

        /* =========================
           CONTAINER
        ========================= */
        .container {
            max-width: 600px;
            margin: auto;
            padding: 12px;
        }

        /* =========================
           CARD
        ========================= */
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1565c0;
        }

        /* =========================
           FORM
        ========================= */
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #475569;
        }

        .sub-label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-top: -3px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, .15);
        }

        input.error {
            border-color: red;
        }

        /* =========================
           RADIO / CONFIRMATION BUTTONS
        ========================= */
        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .radio-btn {
            position: relative;
        }

        .radio-btn input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-label {
            display: block;
            text-align: center;
            padding: 12px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0;
        }

        .radio-btn input[type="radio"]:checked + .radio-label {
            background: #e0e7ff;
            border-color: #1565c0;
            color: #1565c0;
        }

        /* =========================
           BUTTON
        ========================= */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #94a3b8;
        }

        /* =========================
           REKAP SEKTOR & TOTAL
        ========================= */
        .rekap-box {
            margin-bottom: 12px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 10px;
            font-size: 13px;
        }

        .rekap-title {
            font-weight: bold;
            margin-bottom: 6px;
            color: #334155;
        }

        .rekap-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rekap-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .rekap-item {
            font-weight: bold;
            color: #1565c0;
        }

        .rekap-total {
            font-weight: bold;
            color: #0f172a;
        }

        .rekap-info {
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #cbd5e1;
            padding-top: 6px;
            margin-top: 4px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* =========================
           SEARCH
        ========================= */
        .search {
            margin-bottom: 10px;
        }

        /* =========================
           TABLE
        ========================= */
        .table-wrap {
            overflow: auto;
            max-height: 400px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        th {
            background: #1565c0;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        /* =========================
           LOADING
        ========================= */
        .loading {
            display: none;
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid #ddd;
            border-top-color: #1565c0;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           SNACKBAR
        ========================= */
        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: none;
            z-index: 100;
            font-size: 14px;
        }

        /* =========================
           DARK MODE
        ========================= */
        @media(prefers-color-scheme:dark) {
            body {
                background: #0f172a;
                color: white;
            }

            .card {
                background: #1e293b;
            }

            .card-title {
                color: #60a5fa;
            }

            input {
                background: #334155;
                color: white;
                border-color: #475569;
            }

            label {
                color: #cbd5e1;
            }

            .sub-label {
                color: #94a3b8;
            }

            .radio-label {
                background: #334155;
                border-color: #475569;
                color: white;
            }

            .radio-btn input[type="radio"]:checked + .radio-label {
                background: #1e3a8a;
                border-color: #60a5fa;
                color: white;
            }

            .rekap-box {
                background: #334155;
            }

            .rekap-title {
                color: #cbd5e1;
            }

            .rekap-item {
                color: #60a5fa;
            }

            .rekap-total {
                color: #f8fafc;
            }

            .rekap-info {
                color: #94a3b8;
                border-top-color: #475569;
            }

            td {
                color: white;
            }

            tr:nth-child(even) {
                background: #334155;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        Daftar Acara GCQ
    </div>

    <div class="container">

        <!-- FORM INPUT -->
        <div class="card">
            <label for="pengguna">Pendaftar - ID_Sektor ID_Kelas ID_Anggota</label>
            <span class="sub-label">Contoh: RW IA401 WAC01</span>
            <input id="pengguna" type="text" placeholder="Contoh: RW IA401 WAC01" autocomplete="off">

            <label>Konfirmasi Kedatangan</label>
            <div class="radio-group">
                <div class="radio-btn">
                    <input type="radio" id="ya" name="konfirmasi" value="YA" checked onchange="toggleKeterangan()">
                    <label class="radio-label" for="ya">YA</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" id="tidak" name="konfirmasi" value="TIDAK" onchange="toggleKeterangan()">
                    <label class="radio-label" for="tidak">TIDAK</label>
                </div>
            </div>

            <!-- FIELD KETERANGAN BILA TIDAK -->
            <div id="boxKeterangan" style="display: none;">
                <label for="keterangan">Keterangan bila TIDAK</label>
                <input id="keterangan" type="text" placeholder="Alasan tidak hadir">
            </div>

            <button id="btnSimpan" onclick="simpan()">Simpan</button>
        </div>

        <!-- DATA TABLE & REKAP -->
        <div class="card">
            <!-- REKAP PENDAFTAR -->
            <div class="rekap-box">
                <div class="rekap-title">Rekap Pendaftar</div>
                <div class="rekap-content" id="rekapContent"></div>
            </div>

            <input class="search" id="cari" type="text" placeholder="🔍 Cari pendaftar atau konfirmasi" oninput="filterData()">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Pendaftar</th>
                            <th>Konfirmasi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelData"></tbody>
                </table>
            </div>
        </div>

        <!-- TABEL PENDAFTAR DOBEL -->
        <div class="card">
            <div class="card-title">⚠️ Pendaftar Dobel (>1x)</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Pendaftar</th>
                            <th>Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="tabelDobel"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SNACKBAR -->
    <div class="snackbar" id="snackbar"></div>

    <script>
        // =========================
        // KONFIGURASI API & POPULASI
        // =========================
        const API = "https://script.google.com/macros/s/AKfycbznxjUtsAHcYJOKDG-6_WTFG0EKjTgCxgiO0SBwLkDgzurp_43R4EoSn4wHwKfmDhT6/exec";
		 
        const POPULASI = {
            "BA": 104,
            "BI": 31,
            "GA": 105,
            "MA": 20,
            "PR": 66,
            "RG": 64,
            "RW": 86,
            "SA": 111,
            "SL": 45,
            "SU": 59
        };

        const TOTAL_POPULASI = Object.values(POPULASI).reduce((a, b) => a + b, 0);

        let semuaData = [];

        // =========================
        // SAAT HALAMAN DIBUKA
        // =========================
        document.addEventListener("DOMContentLoaded", function () {
            loadData();

            const inputPengguna = document.getElementById("pengguna");

            // 1. Auto-uppercase saat pengguna mengetik
            inputPengguna.addEventListener("input", function () {
                this.value = this.value.toUpperCase();
            });

            // 2. Perbaiki spasi otomatis saat selesai mengetik (pindah fokus / blur)
            inputPengguna.addEventListener("blur", function () {
                this.value = bersihkanPengguna(this.value);
            });
        });

        // =========================
        // AUTO-FIX SPASI & UPPERCASE
        // =========================
        function bersihkanPengguna(inputRaw) {
            // Hapus semua spasi liar dan ubah ke huruf besar
            let bersih = inputRaw.replace(/\s+/g, "").toUpperCase();

            // Cek urutan karakter tanpa spasi: 2 huruf + 2 huruf 3 angka + 3 huruf 2 angka
            let regexPola = /^([A-Z]{2})([A-Z]{2}[0-9]{3})([A-Z]{3}[0-9]{2})$/;
            let match = bersih.match(regexPola);

            if (match) {
                // Jika urutan karakter benar, format ulang spasinya: XX XX123 XXX12
                return `${match[1]} ${match[2]} ${match[3]}`;
            }

            return inputRaw.toUpperCase();
        }

        // =========================
        // TOGGLE INPUT KETERANGAN
        // =========================
        function toggleKeterangan() {
            const isTidak = document.getElementById("tidak").checked;
            const box = document.getElementById("boxKeterangan");
            box.style.display = isTidak ? "block" : "none";

            if (!isTidak) {
                document.getElementById("keterangan").value = "";
            }
        }

        // =========================
        // AMBIL DATA
        // =========================
        async function loadData() {
            tampilLoading(true);

            try {
                const response = await fetch(API + "?action=list");
                semuaData = await response.json();
                tampilTabel(semuaData);
                tampilRekap(semuaData);
                tampilTabelDobel(semuaData);
            } catch (e) {
                snackbar("Gagal mengambil data");
                console.error(e);
            }

            tampilLoading(false);
        }

        // =========================
        // TAMPIL REKAP SEKTOR & TOTAL
        // =========================
        function tampilRekap(data) {
            // Batas Waktu: 6 Agustus 2026 Jam 12.00 WIB (UTC+7)
            const BATAS_WAKTU = new Date("2026-08-06T12:00:00+07:00").getTime();

            let rekapSebelum = {};
            let rekapSesudah = {};

            let totalSebelum = 0;
            let totalSesudah = 0;

            let totalYa = 0;
            let totalKarakterKe4I = 0;
            let totalKarakterKe4A = 0;

            if (Array.isArray(data)) {
                data.forEach(function (r) {
                    // Bersihkan format pendaftar agar seragam "XX XX123 XXX12"
                    let pengguna = bersihkanPengguna((r.pengguna || "").trim());
                    let statusKonfirmasi = (r.konfirmasi || r.acara || "").toUpperCase().trim();

                    // Hitung Rekap Sektor berdasarkan Waktu Pendaftaran
                    if (pengguna.length >= 2) {
                        let kode = pengguna.substring(0, 2).toUpperCase();
                        
                        let rawDate = r.timestamp || r.created_at || r.tanggal;
                        let tglPendaftaran = null;

                        if (rawDate) {
                            let dateStr = String(rawDate).trim();

                            // Mengonversi "YYYY-MM-DD HH:mm:ss" dari Google Sheets 
                            // menjadi "YYYY-MM-DDTHH:mm:ss+07:00" agar dibaca presisi sebagai WIB
                            if (dateStr.includes(" ")) {
                                dateStr = dateStr.replace(" ", "T") + "+07:00";
                            } else if (!dateStr.includes("+") && !dateStr.endsWith("Z")) {
                                dateStr += "+07:00";
                            }

                            tglPendaftaran = new Date(dateStr).getTime();
                        }

                        // Bandingkan dengan Batas Waktu 6 Ags 12:00 WIB
                        if (tglPendaftaran && !isNaN(tglPendaftaran) && tglPendaftaran >= BATAS_WAKTU) {
                            rekapSesudah[kode] = (rekapSesudah[kode] || 0) + 1;
                            totalSesudah++;
                        } else {
                            rekapSebelum[kode] = (rekapSebelum[kode] || 0) + 1;
                            totalSebelum++;
                        }
                    }

                    // Hitung Konfirmasi 'YA' dan Karakter Ke-4
                    if (statusKonfirmasi === "YA") {
                        totalYa++;

                        if (pengguna.length >= 4) {
                            let charKe4 = pengguna.charAt(3).toUpperCase();
                            if (charKe4 === "I") {
                                totalKarakterKe4I++;
                            } else if (charKe4 === "A") {
                                totalKarakterKe4A++;
                            }
                        }
                    }
                });
            }

            let totalSemua = totalSebelum + totalSesudah;
            let sortedKeys = Object.keys(POPULASI).sort();

            let html = "";

            // 1. Rekap Sebelum 6 Ags 12.00 WIB
            html += `<div class="rekap-row"><strong>Submit sebelum 6 Ags 12.00:</strong> `;
            sortedKeys.forEach(function (key) {
                let pendaftar = rekapSebelum[key] || 0;
                let pop = POPULASI[key] || 0;
                let persen = pop > 0 ? ((pendaftar / pop) * 100).toFixed(0) : 0;
                html += `<span class="rekap-item">[${key} = ${pendaftar} (${persen}%)]</span> `;
            });
            html += `</div>`;

            // 2. Rekap Sesudah 6 Ags 12.00 WIB
            html += `<div class="rekap-row"><strong>Submit sesudah 6 Ags 12.00:</strong> `;
            sortedKeys.forEach(function (key) {
                let pendaftar = rekapSesudah[key] || 0;
                html += `<span class="rekap-item">[${key} = ${pendaftar}]</span> `;
            });
            html += `</div>`;

            // 3. Jumlah Total Pendaftar dan Persen
            let persenTotal = TOTAL_POPULASI > 0 ? ((totalSemua / TOTAL_POPULASI) * 100).toFixed(1) : 0;
            html += `
                <div class="rekap-row" style="margin-top: 4px;">
                    <span class="rekap-total">Total Pendaftar = ${totalSemua} (${persenTotal}%)</span>
                </div>
            `;

            // 4. Informasi Tambahan di Akhir
            html += `
                <div class="rekap-info">
                    <span><strong>Jumlah YA:</strong> ${totalYa}</span>
                    <span><strong>Ikhwan :</strong> ${totalKarakterKe4I}</span>
                    <span><strong>Akhwat :</strong> ${totalKarakterKe4A}</span>
                </div>
            `;

            document.getElementById("rekapContent").innerHTML = html;
        }

        // =========================
        // TAMPIL TABEL
        // =========================
        function tampilTabel(data) {
            let html = "";

            if (!Array.isArray(data) || data.length === 0) {
                html = `
                <tr>
                    <td colspan="2" style="text-align:center">Tidak ada data</td>
                </tr>`;
            } else {
                let dataReversed = [...data].reverse();
				dataReversed.forEach(function (r) {
                    let statusKonfirmasi = aman(r.konfirmasi || r.acara || "");
                    let ket = aman(r.keterangan || "");

                    let tampilStatus = statusKonfirmasi;
                    if (statusKonfirmasi === "TIDAK" && ket) {
                        tampilStatus += ` (${ket})`;
                    }

                    html += `
                    <tr>
                        <td>${aman(r.pengguna)}</td>
                        <td>${tampilStatus}</td>
                    </tr>`;
                });
            }

            document.getElementById("tabelData").innerHTML = html;
        }

        // =========================
        // TAMPIL TABEL DOBEL
        // =========================
        function tampilTabelDobel(data) {
            let hitung = {};

            if (Array.isArray(data)) {
                data.forEach(function (r) {
                    let pendaftar = bersihkanPengguna((r.pengguna || "").trim());
                    if (pendaftar) {
                        hitung[pendaftar] = (hitung[pendaftar] || 0) + 1;
                    }
                });
            }

            let dobel = Object.keys(hitung).filter(key => hitung[key] > 1);
            let html = "";

            if (dobel.length === 0) {
                html = `
                <tr>
                    <td colspan="2" style="text-align:center">Tidak ada pendaftar dobel</td>
                </tr>`;
            } else {
                dobel.forEach(function (key) {
                    html += `
                    <tr>
                        <td>${aman(key)}</td>
                        <td>${hitung[key]}x</td>
                    </tr>`;
                });
            }

            document.getElementById("tabelDobel").innerHTML = html;
        }

        // =========================
        // FILTER PENCARIAN
        // =========================
        function filterData() {
            let keyword = document.getElementById("cari").value.toLowerCase();

            let hasil = semuaData.filter(function (r) {
                let pendaftar = (r.pengguna || "").toLowerCase();
                let konfirmasi = (r.konfirmasi || r.acara || "").toLowerCase();
                let ket = (r.keterangan || "").toLowerCase();

                return (
                    pendaftar.includes(keyword) ||
                    konfirmasi.includes(keyword) ||
                    ket.includes(keyword)
                );
            });

            tampilTabel(hasil);
            tampilRekap(hasil);
            tampilTabelDobel(hasil);
        }

        // =========================
        // SIMPAN DATA
        // =========================
        async function simpan() {
            let inputEl = document.getElementById("pengguna");

            let pengguna = bersihkanPengguna(inputEl.value);
            inputEl.value = pengguna;

            let regexBaku = /^[A-Z]{2}\s[A-Z]{2}[0-9]{3}\s[A-Z]{3}[0-9]{2}$/;

            if (!regexBaku.test(pengguna)) {
                errorInput("pengguna", "Format pendaftar salah! Contoh: RW IA401 WAC01");
                return;
            }

            let konfirmasi = document.querySelector('input[name="konfirmasi"]:checked').value;
            let keterangan = document.getElementById("keterangan").value.trim();

            if (konfirmasi === "TIDAK" && keterangan === "") {
                errorInput("keterangan", "Isi keterangan jika memilih TIDAK");
                return;
            }

            let tombol = document.getElementById("btnSimpan");
            tombol.disabled = true;
            tombol.innerHTML = "Menyimpan...";

            try {
                const params = new URLSearchParams({
                    action: "simpan",
                    pengguna: pengguna,
                    konfirmasi: konfirmasi,
                    keterangan: keterangan
                });

                let response = await fetch(`${API}?${params.toString()}`);
                let hasil = await response.json();

                if (hasil.success) {
                    snackbar("Data berhasil disimpan");
                    document.getElementById("pengguna").value = "";
                    document.getElementById("keterangan").value = "";
                    document.getElementById("ya").checked = true;
                    toggleKeterangan();
                    loadData();
                } else {
                    snackbar(hasil.message || "Gagal menyimpan");
                }

            } catch (e) {
                snackbar("Server tidak merespon");
                console.error(e);
            }

            tombol.disabled = false;
            tombol.innerHTML = "Simpan";
        }

        // =========================
        // UTILITAS
        // =========================
        function tampilLoading(status) {
            document.getElementById("loading").style.display = status ? "block" : "none";
        }

        function snackbar(text) {
            let s = document.getElementById("snackbar");
            s.innerHTML = text;
            s.style.display = "block";

            setTimeout(function () {
                s.style.display = "none";
            }, 2500);
        }

        function errorInput(id, msg) {
            let el = document.getElementById(id);
            el.classList.add("error");
            snackbar(msg);

            setTimeout(function () {
                el.classList.remove("error");
            }, 2000);
        }

        function aman(text) {
            if (!text) return "";
            return text
                .toString()
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
    </script>
</body>

</html>
